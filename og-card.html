<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IEP Agent og card</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  body{width:1200px; height:630px; background:linear-gradient(135deg,#fdf2f8 0%,#fffcfd 45%,#f0fdf4 100%); font-family:'Inter',sans-serif; color:#332140; overflow:hidden; position:relative;}
  .band{position:absolute; top:0; left:0; right:0; height:14px; background:linear-gradient(90deg,#9333ea,#f472b6 60%,#4ade80);}
  .in{padding:74px 78px;}
  .brand{display:flex; align-items:center; gap:16px; font-family:'Newsreader',serif; font-size:40px; font-weight:600; color:#581c87;}
  .brand svg{width:52px; height:52px;}
  h1{font-family:'Newsreader',serif; font-weight:500; font-size:62px; line-height:1.08; color:#581c87; margin:44px 0 22px; max-width:980px;}
  p{font-size:24px; color:#6b5a78; max-width:900px; line-height:1.45;}
  .chips{display:flex; gap:12px; margin-top:38px;}
  .chip{font-size:17px; font-weight:600; padding:9px 18px; border:2px solid #9333ea; color:#9333ea;}
  .chip.fill{background:#9333ea; color:#fff;}
  .chip.pink{border-color:#f472b6; color:#9d174d;}
  .foot{position:absolute; bottom:52px; left:78px; right:78px; font-size:19px; font-weight:500; color:#6b5a78; border-top:2px solid #f2d9ea; padding-top:16px;}
</style>
</head>
<body>
<div class="band"></div>
<div class="in">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" fill="#9333ea"/><path d="M10 24V8h9M10 16h7" stroke="#fdf2f8" stroke-width="3"/><circle cx="24" cy="24" r="4" fill="#f472b6"/></svg>
    IEP Agent
  </div>
  <h1>An agent for the meetings, the paperwork, and the words.</h1>
  <p>A free, local-first assistant that helps parents build and keep their child's IEP. The plan stays on your computer.</p>
  <div class="chips">
    <span class="chip fill">Free agent</span>
    <span class="chip">Local-first</span>
    <span class="chip pink">No accounts</span>
  </div>
  <div class="foot">iepagent.com &nbsp;&middot;&nbsp; Free software for families, built on Hermes Agent</div>
</div>
</body>
</html>
